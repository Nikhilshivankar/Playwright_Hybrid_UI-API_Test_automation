[pytest]
# Default command-line arguments
# We enable allure results and JSON reports automatically, while pointing output to the reports/ directory
addopts = -v -s --alluredir=reports/allure-results --json-report --json-report-file=reports/report.json --json-report-omit=log -n auto --basetemp=reports/tmp --junitxml=reports/junit-report.xml --html=reports/report.html --self-contained-html

# Minimum log level to print to CLI
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# File logging settings
log_file = reports/run.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_file_date_format = %Y-%m-%d %H:%M:%S

# Directories containing tests
testpaths = tests

# Custom markers
markers =
    smoke: Smoke tests for critical paths
    regression: Full regression suite
    login: Authentication related tests
    api: API validation tests
    sanity: Sanity validation suite
    performance: Performance validation suite
    tc_id: Assigns a Test Case ID to the test
    e2e: End to end testing suite

filterwarnings =
    ignore::DeprecationWarning

