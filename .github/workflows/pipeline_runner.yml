name: Playwright Test Automation CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-execution:
    name: Execute Playwright Automation Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # Speeds up workflow by caching pip dependencies

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browser Binaries & System Dependencies
      run: |
        playwright install --with-deps chromium

    - name: Execute Pytest Suite
      env:
        # Inject framework variables from GitHub Actions environment
        BASE_URL: https://practicetestautomation.com
        BROWSER: chromium
        HEADLESS: true
        LOG_LEVEL: INFO
        TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
        TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      run: |
        pytest

    - name: Archive Execution Reports & Logs
      if: always() # Ensure report is uploaded even if tests fail
      uses: actions/upload-artifact@v4
      with:
        name: test-execution-reports-and-logs
        path: |
          reports/
        retention-days: 14
