name: Playwright Test Automation CI (AWS EC2)

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Select the test suite to execute'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - sanity
          - regression
          - api
          - e2e

jobs:
  test-execution:
    name: Execute ${{ matrix.test_type }} Tests (${{ matrix.browser }})
    # Target AWS EC2 self-hosted runner(s)
    runs-on: [self-hosted, linux]

    strategy:
      fail-fast: false
      matrix:
        include:
          - test_type: ui
            browser: chromium
          - test_type: ui
            browser: firefox
          - test_type: ui
            browser: webkit
          - test_type: api
            browser: none

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # Speeds up workflow by caching pip dependencies

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browser Binaries & System Dependencies
      if: matrix.test_type == 'ui'
      run: |
        playwright install --with-deps ${{ matrix.browser }}

    - name: Execute Pytest Suite
      env:
        # Inject framework variables from GitHub Actions environment
        BASE_URL: ${{ vars.BASE_URL }}
        API_BASE_URL: ${{ vars.API_BASE_URL }}
        BROWSER: ${{ matrix.browser }}
        HEADLESS: ${{ vars.HEADLESS }}
        LOG_LEVEL: ${{ vars.LOG_LEVEL }}
        TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
        TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      run: |
        SUITE="${{ github.event.inputs.test_suite }}"
        TARGET_DIR="tests/${{ matrix.test_type }}"
        
        if [ "${{ matrix.test_type }}" = "ui" ]; then
          if [ -z "$SUITE" ] || [ "$SUITE" = "all" ]; then
            echo "Executing all UI tests on ${{ matrix.browser }}..."
            pytest "$TARGET_DIR" --browser ${{ matrix.browser }}
          else
            echo "Executing UI tests in $TARGET_DIR marked with: $SUITE on ${{ matrix.browser }}..."
            pytest "$TARGET_DIR" --browser ${{ matrix.browser }} -m "$SUITE"
          fi
        else
          if [ -z "$SUITE" ] || [ "$SUITE" = "all" ]; then
            echo "Executing all API tests..."
            pytest "$TARGET_DIR"
          else
            echo "Executing API tests in $TARGET_DIR marked with: $SUITE..."
            pytest "$TARGET_DIR" -m "$SUITE"
          fi
        fi

    - name: Archive Execution Reports & Logs
      if: always() # Ensure report is uploaded even if tests fail
      uses: actions/upload-artifact@v4
      with:
        name: test-execution-reports-and-logs-${{ matrix.test_type }}-${{ matrix.browser }}
        path: |
          reports/
        retention-days: 14
